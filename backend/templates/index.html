<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Tracker</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

  <!-- Minimal Header -->
  <header class="bg-slate-800/80 border-b border-slate-700/80 sticky top-0 z-30 backdrop-blur">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="h-9 w-9 rounded-lg bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
          <i data-lucide="scan-line" class="w-5 h-5"></i>
        </div>
        <h1 class="text-base font-semibold text-white">Attendance Tracker</h1>
      </div>

      <div class="flex items-center space-x-3">
        <!-- Live status dot -->
        <div class="flex items-center space-x-1.5 text-xs text-slate-400 bg-slate-900/60 px-2.5 py-1 rounded-full border border-slate-700">
          <span id="statusDot" class="h-2 w-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="statusText">Live</span>
        </div>

        <!-- Enroll Button -->
        <button onclick="openRegisterModal()" class="flex items-center space-x-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium px-3 py-1.5 rounded-lg transition shadow-sm">
          <i data-lucide="user-plus" class="w-4 h-4"></i>
          <span>Enroll Card</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 py-6 w-full space-y-5 flex-1">

    <!-- 3 Essential Summary Cards -->
    <div class="grid grid-cols-3 gap-3 sm:gap-4">
      <div class="bg-slate-800/60 border border-slate-700/70 rounded-xl p-4">
        <p class="text-xs text-slate-400">Present Today</p>
        <p id="statTodayAttendees" class="text-2xl font-bold text-emerald-400 mt-0.5">-</p>
      </div>
      <div class="bg-slate-800/60 border border-slate-700/70 rounded-xl p-4">
        <p class="text-xs text-slate-400">Currently Inside</p>
        <p id="statCurrentlyIn" class="text-2xl font-bold text-cyan-400 mt-0.5">-</p>
      </div>
      <div class="bg-slate-800/60 border border-slate-700/70 rounded-xl p-4">
        <p class="text-xs text-slate-400">Total Enrolled</p>
        <p id="statTotalUsers" class="text-2xl font-bold text-white mt-0.5">-</p>
      </div>
    </div>

    <!-- Live Scan Banner (Only appears on card tap) -->
    <div id="liveAlertCard" class="hidden rounded-xl border p-4 transition-all duration-200">
      <div class="flex items-center justify-between flex-wrap gap-3">
        <div class="flex items-center space-x-3">
          <span id="liveAlertBadge" class="text-xs font-bold px-2 py-0.5 rounded-md uppercase">IN</span>
          <div>
            <h3 id="liveAlertName" class="text-base font-semibold text-white">Person Name</h3>
            <p id="liveAlertSub" class="text-xs text-slate-400">Card: <span id="liveAlertUID" class="font-mono">A1B2C3D4</span> • <span id="liveAlertTime">Time</span></p>
          </div>
        </div>
        <div id="liveAlertAction"></div>
      </div>
    </div>

    <!-- Navigation Tabs: Attendance vs Users -->
    <div class="flex items-center justify-between border-b border-slate-700 pb-2">
      <div class="flex space-x-2">
        <button onclick="switchView('attendance')" id="tabBtn-attendance" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-700 text-white transition">
          Attendance Log
        </button>
        <button onclick="switchView('users')" id="tabBtn-users" class="px-3 py-1.5 text-xs font-medium text-slate-400 hover:text-white rounded-lg transition">
          Enrolled Users
        </button>
      </div>

      <!-- Action controls for Attendance view -->
      <div id="attendanceControls" class="flex items-center space-x-2">
        <input type="date" id="filterDate" onchange="loadAttendance()" class="bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-slate-200 focus:outline-none focus:border-slate-500">
        <button onclick="exportCSV()" class="flex items-center space-x-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs px-2.5 py-1 rounded-lg transition">
          <i data-lucide="download" class="w-3.5 h-3.5"></i>
          <span>CSV</span>
        </button>
      </div>
    </div>

    <!-- View 1: Attendance Log Table -->
    <div id="view-attendance" class="bg-slate-800/40 border border-slate-700/60 rounded-xl overflow-hidden">
      <table class="w-full text-left text-xs text-slate-300">
        <thead class="bg-slate-800/80 text-slate-400 uppercase font-semibold border-b border-slate-700">
          <tr>
            <th class="py-2.5 px-4">Time</th>
            <th class="py-2.5 px-4">Status</th>
            <th class="py-2.5 px-4">Name</th>
            <th class="py-2.5 px-4">ID</th>
            <th class="py-2.5 px-4 font-mono">UID</th>
          </tr>
        </thead>
        <tbody id="attendanceTableBody" class="divide-y divide-slate-700/40">
          <tr>
            <td colspan="5" class="text-center py-8 text-slate-500">Loading attendance logs...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- View 2: Enrolled Users Table -->
    <div id="view-users" class="hidden bg-slate-800/40 border border-slate-700/60 rounded-xl overflow-hidden">
      <table class="w-full text-left text-xs text-slate-300">
        <thead class="bg-slate-800/80 text-slate-400 uppercase font-semibold border-b border-slate-700">
          <tr>
            <th class="py-2.5 px-4">Name</th>
            <th class="py-2.5 px-4">ID / Roll</th>
            <th class="py-2.5 px-4">Department / Role</th>
            <th class="py-2.5 px-4 font-mono">Card UID</th>
            <th class="py-2.5 px-4 text-right">Action</th>
          </tr>
        </thead>
        <tbody id="usersTableBody" class="divide-y divide-slate-700/40">
          <tr>
            <td colspan="5" class="text-center py-8 text-slate-500">Loading users...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>

  <!-- Enroll User Modal -->
  <div id="registerModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-sm w-full p-5 shadow-xl">
      <div class="flex justify-between items-center mb-3">
        <h3 class="font-semibold text-white text-sm">Enroll New Card</h3>
        <button onclick="closeRegisterModal()" class="text-slate-400 hover:text-white">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-3">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Card UID *</label>
          <div class="flex space-x-1.5">
            <input type="text" id="regCardUid" required placeholder="e.g. A1B2C3D4" class="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white font-mono uppercase w-full focus:outline-none focus:border-emerald-500">
            <button type="button" onclick="fetchLastScanned()" title="Fetch last scanned card" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs px-2.5 py-1.5 rounded-lg shrink-0">
              Fetch
            </button>
          </div>
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Full Name *</label>
          <input type="text" id="regName" required placeholder="e.g. John Doe" class="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white w-full focus:outline-none focus:border-emerald-500">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs text-slate-400 mb-1">ID / Roll</label>
            <input type="text" id="regIdentifier" placeholder="EMP-101" class="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white w-full focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Department</label>
            <input type="text" id="regDepartment" placeholder="General" class="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white w-full focus:outline-none focus:border-emerald-500">
          </div>
        </div>

        <div id="regError" class="hidden text-xs text-rose-400 bg-rose-950/40 p-2 rounded border border-rose-800"></div>

        <div class="pt-2 flex justify-end space-x-2">
          <button type="button" onclick="closeRegisterModal()" class="px-3 py-1.5 rounded-lg text-xs text-slate-300 hover:bg-slate-700">Cancel</button>
          <button type="submit" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-600 hover:bg-emerald-500 text-white">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
